# Bygger sidan och publicerar dist/ på GitHub Pages vid varje push till main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # gör att du kan köra den manuellt under fliken Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Bara en publicering åt gången; en ny push avbryter inte en pågående publicering.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
