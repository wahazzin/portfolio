# Manuell körning (fliken Actions -> "Capture project screenshots" -> Run workflow).
# Tar nya skärmdumpar av projektsajterna och committar dem till main.
name: Capture project screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright sharp
      - run: npx playwright install --with-deps chromium
      - run: node scripts/capture-screenshots.mjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add public/images/*.webp
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update project screenshots"
          git push
